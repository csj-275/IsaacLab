robot_cfg:
  kinematics:
    use_usd_kinematics: False
    isaac_usd_path: ""
    usd_path: ""
    usd_robot_root: "/piper"
    usd_flip_joints: {}
    usd_flip_joint_limits: []

    urdf_path: "piper_description/urdf/piper_description_v100_realsense_camera_v2.urdf"
    asset_root_path: ""
    base_link: "arm_base"
    ee_link: "link6"
    collision_link_names: null
    collision_spheres: null
    collision_sphere_buffer: 0.005
    extra_collision_spheres: {"attached_object": 100}
    use_global_cumul: True
    self_collision_ignore:
      {
        "arm_base": ["link1", "link2"],
        "link1": ["link2", "link3"],
        "link2": ["link3", "link4"],
        "link3": ["link4", "link5"],
        "link4": ["link5", "link6"],
        "link5": ["link6", "link7", "link8"],
        "link6": ["link7", "link8", "attached_object"],
        "link7": ["link8", "attached_object"],
        "link8": ["attached_object"],
      }
    self_collision_buffer:
      {
        "arm_base": 0.1,
        "link1": 0.05,
        "link2": 0.0,
        "link3": 0.0,
        "link4": 0.0,
        "link5": 0.0,
        "link6": 0.0,
        "link7": 0.01,
        "link8": 0.01,
        "attached_object": 0.0,
      }
    link_names:
      [
        "arm_base",
        "link1",
        "link2",
        "link3",
        "link4",
        "link5",
        "link6",
        "link7",
        "link8",
      ]
    mesh_link_names:
      [
        "arm_base",
        "link1",
        "link2",
        "link3",
        "link4",
        "link5",
        "link6",
        "link7",
        "link8",
      ]
    lock_joints: {"joint7": 0.05, "joint8": -0.05}
    extra_links: {"attached_object": {"parent_link_name": "link6","link_name": "attached_object", "fixed_transform": [0,0,0,1,0,0,0], "joint_type":"FIXED", "joint_name": "attach_joint" }}
    cspace:
      joint_names: ["joint1","joint2","joint3","joint4", "joint5","joint6","joint7","joint8"]
      retract_config: [0.0, 1.0, -1.2, 0.0, 0.8, 0.0, 0.05, -0.05]
      null_space_weight: [1,1,1,1,1,1,1,1]
      cspace_distance_weight: [1,1,1,1,1,1,1,1]
      max_acceleration: 15.0
      max_jerk: 500.0
