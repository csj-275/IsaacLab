services:
  isaac-lab-base:
    volumes:
      - type: bind
        source: ../datasets
        target: /workspace/isaaclab/datasets
      - type: bind
        source: ../usd
        target: /workspace/isaaclab/usd
      - type: bind
        source: ../logs
        target: /workspace/isaaclab/logs
      - type: bind
        source: ../src/nvidia-curobo
        target: /workspace/isaaclab/src/nvidia-curobo
      - type: bind
        source: ../cuda_12.8.0_570.86.10_linux.run
        target: /workspace/isaaclab/cuda_12.8.0_570.86.10_linux.run
        read_only: true
